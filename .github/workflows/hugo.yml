# ============================================================
#  Hugo + Stack 빌드 & GitHub Pages 배포
#  로컬에 Hugo 설치 불필요 — 클라우드에서 빌드.
# ============================================================
name: Build & Deploy (Hugo)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 자동발행(Publish from Notion)이 GITHUB_TOKEN으로 커밋하면 push 이벤트가
  # 다른 워크플로를 트리거하지 않는다(무한루프 방지). 그래서 그 워크플로가
  # 끝나면 여기서 이어받아 빌드·배포한다. (변경 없으면 같은 내용 재배포 — 무해)
  workflow_run:
    workflows: ["Publish from Notion"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run으로 불려온 경우엔 발행이 main에서 성공했을 때만 배포한다
    # (실패/취소 발행에 헛배포 방지). 다른 트리거(push·수동)는 그대로 실행.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout (서브모듈 포함 = 테마)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 글 검증 (front matter / taxonomy)
        run: |
          pip install pyyaml
          python scripts/validate_posts.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Seoul
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

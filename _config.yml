# ============================================================
#  학습 블로그 — Jekyll 설정
#  정본: SYSTEM-SPEC.md (이 설정은 spec 2절 결정 사항을 따른다)
# ============================================================

# --- 사이트 기본 ---
title: "독학 노트"
subtitle: "C++ · 언리얼 · 블렌더 · 3D — 배운 걸 차곡차곡"
description: "혼자 공부하며 이해한 것을 기록하는 학습 블로그"
lang: ko
locale: "ko-KR"
url: "https://banchan723.github.io"
# baseurl 은 보통 비움(사용자 페이지 {아이디}.github.io 인 경우)
baseurl: ""

# 시간대 + 미래 날짜 글 빌드 허용
# (한국시간 작성 글이 UTC 빌드 서버 기준 "미래"라 빠지는 문제 방지)
timezone: Asia/Seoul
future: true

# 사이드바 작성자 정보
author:
  name: "Banchan723"
  bio: "혼자 공부한 걸 차곡차곡 기록합니다."
  location: "Korea"

# --- 테마 (spec: minimal-mistakes remote_theme) ---
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"  # 취향 결정 후 변경 가능: air, dark, contrast 등

# --- 플러그인 ---
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# --- 글(_posts) 처리 ---
# _posts 하위 폴더(cpp/unreal/...)도 Jekyll이 자동 수집한다.
# 카테고리는 폴더가 아니라 front matter의 category 값으로 정해진다.
permalink: /:categories/:slug/   # 주소에 slug 사용 (slug 불변 규칙과 연결)

# --- 검색 (테마 내장. v1에서 켜만 두고 강화는 v3) ---
search: true
search_full_content: true

# --- 카테고리/태그 목록 페이지 (Liquid 방식) ---
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# --- 글 기본값 ---
defaults:
  # 글(post): 왼쪽 사이드바에 카테고리 메뉴 + 목차
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "sidebar-categories"   # 왼쪽 카테고리 트리
      read_time: true
      comments: false        # 댓글은 나중에(utterances 등) 결정
      share: false
      related: true          # 관련 글 노출 (테마 기능)
      show_date: true
      toc: true              # 글 목차 자동
      toc_sticky: true
  # 일반 페이지(홈·카테고리·태그): 동일한 왼쪽 사이드바
  - scope:
      path: ""
      type: pages
    values:
      author_profile: true
      sidebar:
        nav: "sidebar-categories"

# --- 페이지네이션 ---
paginate: 10
paginate_path: /page:num/

# --- 빌드 제외 ---
exclude:
  - SYSTEM-SPEC.md
  - NOTION-DB.md
  - COWORK-PUBLISH.md
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/

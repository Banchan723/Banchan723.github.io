# ============================================================
#  taxonomy.yml — 허용된 카테고리·태그 사전 (단일 정본)
#  정본: SYSTEM-SPEC.md 5절 절대규칙
#
#  규칙:
#   - 글의 category 는 반드시 이 목록의 key 중 하나.
#   - 글의 tags 는 해당 category 의 allowed_tags 안에 있는 것만.
#   - 새 카테고리/태그가 필요하면 → 사용자 승인 후 여기에 추가. AI 임의 추가 금지.
#   - context 값도 아래 contexts 목록 안에서만.
#  validate.yml(scripts/validate_posts.py) 가 이 파일을 기준으로 모든 글을 검사한다.
# ============================================================

# context = 학습 맥락(어느 분야). 중복판정 키의 한 축.
contexts:
  - cpp
  - unreal
  - blender
  - tripo

categories:
  cpp:
    label: "C++"
    description: "C++ 언어 학습"
    allowed_tags:
      - syntax        # 문법
      - pointer       # 포인터
      - reference     # 참조
      - memory        # 메모리/new·delete
      - smart-pointer # 스마트 포인터
      - class         # 클래스
      - const         # const
      - stl           # 표준 라이브러리
      - function      # 함수
      - oop           # 객체지향

  unreal:
    label: "Unreal Engine"
    description: "언리얼 엔진 학습"
    allowed_tags:
      - blueprint     # 블루프린트
      - actor
      - component
      - gameplay
      - input         # 입력 시스템
      - material
      - widget        # UI
      - gas           # Gameplay Ability System
      - ai            # 적 AI
      - cpp-ue        # 언리얼 C++

  blender:
    label: "Blender"
    description: "블렌더 학습"
    allowed_tags:
      - modeling
      - sculpting
      - uv
      - rigging
      - animation
      - material
      - rendering
      - shortcut

  tripo:
    label: "Tripo 3D"
    description: "Tripo 등 AI 3D 모델 생성"
    allowed_tags:
      - generation    # 모델 생성
      - cleanup       # 정리/리토폴로지
      - texturing
      - export
      - rigging

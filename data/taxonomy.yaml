# ============================================================
#  taxonomy.yaml — 허용된 카테고리·태그 사전 (단일 정본)
#  Hugo 데이터(data/) 겸 검증 스크립트(scripts/validate_posts.py) 기준표.
#
#  규칙(SYSTEM-SPEC 참고):
#   - 글의 categories 는 아래 categories 의 키(표시명) 중에서만.
#   - 글의 tags 는 해당 category 의 allowed_tags 안에서만.
#   - context 는 해당 category 에 묶인 값과 일치해야 함 (중복판정 키의 한 축).
#   - 새 카테고리/태그가 필요하면 사용자 승인 후 여기에 추가. AI 임의 추가 금지.
# ============================================================

# context = 학습 맥락(영문 소문자). 중복판정 키 = canonical_topic + context.
contexts:
  - cpp
  - unreal
  - blender
  - tripo

categories:
  "C++":
    context: cpp
    color: "#5aa2ff"
    allowed_tags:
      - 포인터
      - 참조
      - 메모리
      - 스마트포인터
      - 클래스
      - const
      - STL
      - 함수
      - 객체지향
      - 문법

  "Unreal":
    context: unreal
    color: "#4dd5d5"
    allowed_tags:
      - 블루프린트
      - 액터
      - 컴포넌트
      - 입력
      - 머티리얼
      - 위젯
      - GAS
      - AI
      - 게임플레이
      - 언리얼C++

  "Blender":
    context: blender
    color: "#ffa65c"
    allowed_tags:
      - 모델링
      - 스컬핑
      - UV
      - 리깅
      - 애니메이션
      - 머티리얼
      - 렌더링
      - 단축키

  "Tripo 3D":
    context: tripo
    color: "#b98cff"
    allowed_tags:
      - 생성
      - 정리
      - 텍스처
      - 익스포트
      - 리깅

{{ define "main" }}
<div class="b-wrap" style="max-width:720px">
  <div class="b-crumb">
    <a href="{{ "/" | relURL }}">~</a><span class="sep">/</span>
    <span class="cur">{{ .File.ContentBaseName }}.md</span>
  </div>

  {{ if eq .File.ContentBaseName "about" }}
  <h1 style="font-size:26px;font-weight:800;margin:0 0 14px"><span style="color:var(--accent)">$</span> whoami</h1>
  {{ else }}
  <h1 style="font-size:26px;font-weight:800;margin:0 0 14px">{{ .Title }}</h1>
  {{ end }}

  <div class="b-art">
    <div class="body" style="font-size:15px">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
